<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>dombyr.com — Табиғи Қоңыр Үн Зертханасы</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(circle at 50% 15%, #26170c 0%, #070402 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ebd5b3;
      overflow: hidden;
    }
    header {
      padding-top: 8px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: #e5a43b;
      font-weight: 700;
    }
    .status-bar {
      margin-top: 3px;
      font-size: 0.72rem;
      color: #b09171;
    }

    /* Домбыра мойны мен пернелер */
    .instrument-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      height: 68vh;
      background: linear-gradient(90deg, #211006 0%, #4d2913 50%, #1c0d05 100%);
      border-radius: 12px;
      border: 2px solid #63381b;
      box-shadow: inset 0 0 28px rgba(0,0,0,0.88), 0 12px 32px rgba(0,0,0,0.9);
      overflow: hidden;
      display: flex;
    }

    .frets-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
    }
    .fret-row {
      flex: 1;
      border-bottom: 2px solid #825329;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 0.64rem;
      color: #c49a6c;
      pointer-events: none;
      transition: background 0.12s ease;
    }
    .fret-row.open-string {
      background: rgba(229, 164, 59, 0.08);
      border-bottom: 3px solid #b8864c;
      font-weight: 600;
      color: #e5a43b;
    }
    .fret-row.active-fret {
      background: rgba(229, 164, 59, 0.22);
    }

    .strings-layer {
      position: absolute;
      inset: 0;
      display: flex;
      z-index: 10;
    }
    .string-lane {
      flex: 1;
      position: relative;
      cursor: pointer;
    }

    .string-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #c9ad82, #fff6e5 50%, #8f6b39);
      box-shadow: 0 0 6px rgba(229, 164, 59, 0.35);
      pointer-events: none;
      transition: transform 0.05s ease-out;
    }
    #line1 { width: 3.2px; }
    #line2 { width: 2.3px; }

    /* Төменгі Шанақ пен Қос Қағыс аймағы */
    .shanaq-deck {
      width: 100%;
      max-width: 340px;
      height: 15vh;
      background: radial-gradient(circle at 50% 50%, #4a2611 0%, #1f0f06 100%);
      border-radius: 16px;
      border: 2px solid #6e3f1f;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 6px 20px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .shanaq-deck:active {
      transform: scale(0.99);
      background: radial-gradient(circle at 50% 50%, #5c3016 0%, #291408 100%);
    }
    /* Түндік (дыбыс ойығы) сұлбасы */
    .tundik-hole {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #080402;
      border: 2px solid #8c582b;
      box-shadow: inset 0 0 8px #000;
      margin-bottom: 4px;
    }
    .strum-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #e5a43b;
      letter-spacing: 2px;
    }
    .strum-sub {
      font-size: 0.66rem;
      color: #b5977a;
      margin-top: 2px;
    }

    footer {
      padding-bottom: 8px;
      font-size: 0.68rem;
      color: #7d654d;
    }
  </style>
</head>
<body>

  <header>
    <h1>DOMBYR.COM</h1>
    <div class="status-bar" id="statusText">Ашық ішек + 14 перне | Ұзақ қоңыр күмбір</div>
  </header>

  <div class="instrument-wrap" id="board">
    <div class="frets-layer" id="fretsGrid"></div>
    <div class="strings-layer">
      <!-- Сол жақ: Үстіңгі ішек (Ре - D3) -->
      <div class="string-lane" id="lane1"><div class="string-line" id="line1"></div></div>
      <!-- Оң жақ: Астыңғы ішек (Соль - G3) -->
      <div class="string-lane" id="lane2"><div class="string-line" id="line2"></div></div>
    </div>
  </div>

  <!-- Шанақ үстіндегі Қос Қағыс аймағы -->
  <div class="shanaq-deck" id="strumPad">
    <div class="tundik-hole"></div>
    <div class="strum-title">ҚОС ҚАҒЫС (ШАНАҚ)</div>
    <div class="strum-sub">Екі ішекті бірдей тірі қағыспен шерту</div>
  </div>

  <footer>Пернені басып тұрып немесе тікелей шертіп ойнаңыз</footer>

  <script>
    // 0 (Ашық ішек) және 1-14 пернелерді құру (барлығы 15 саты)
    const fretsGrid = document.getElementById('fretsGrid');
    const fretElements = [];

    const FRET_NAMES = {
      0: 'Ашық бұрау (Ре - Соль)',
      1: 'Бас перне',
      5: 'Қос перне (Кварта)',
      7: 'Орта перне (Квинта)',
      12: 'Саға (Октава)',
      14: 'Құлақ перне'
    };

    for (let i = 0; i <= 14; i++) {
      const row = document.createElement('div');
      row.className = 'fret-row' + (i === 0 ? ' open-string' : '');
      const label = FRET_NAMES[i] || '';
      row.innerHTML = `<span>${i === 0 ? '0 (Ашық)' : i + '-перне'}</span><span>${label}</span>`;
      fretsGrid.appendChild(row);
      fretElements.push(row);
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    let reverbNode = null;

    // Негізгі жиіліктер: Ре (D3 = 146.83 Гц), Соль (G3 = 196.00 Гц)
    const BASE_FREQS = { lane1: 146.83, lane2: 196.00 };

    // 0-ден 14-пернеге дейінгі дәстүрлі қазақы диатоникалық/пифагорлық өсу сатысы
    const DOMBRA_SCALE = [
      1.000, // 0: Ашық ішек
      1.059, // 1-перне
      1.122, // 2-перне
      1.189, // 3-перне
      1.260, // 4-перне
      1.335, // 5-перне (таза кварта)
      1.414, // 6-перне
      1.498, // 7-перне (таза квинта - орталық тірек)
      1.587, // 8-перне
      1.682, // 9-перне
      1.782, // 10-перне
      1.888, // 11-перне
      2.000, // 12-перне (таза октава)
      2.118, // 13-перне
      2.245  // 14-перне
    ];

    let selectedFret = 0;
    let strumDirection = 1; // 1 = төмен қағыс, -1 = жоғары қағыс

    // Шанақ ішіндегі табиғи акустикалық кеңістік (Micro-Reverb)
    function createShanaqReverb(context) {
      const len = Math.floor(context.sampleRate * 1.1);
      const buf = context.createBuffer(2, len, context.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          // Жұмсақ ағаш ішіндегі жаңғырық сөнуі
          d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (context.sampleRate * 0.22)) * 0.25;
        }
      }
      const conv = context.createConvolver();
      conv.buffer = buf;
      return conv;
    }

    function ensureAudio() {
      if (!ctx) {
        ctx = new AudioContext();
        reverbNode = createShanaqReverb(ctx);
        const revGain = ctx.createGain();
        revGain.gain.value = 0.28;
        reverbNode.connect(revGain);
        revGain.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    }

    // Төрт сатылы ағаш шанақ резонаторы (Темір үнді болдырмау)
    function buildWoodBodyChain(context, fretNum) {
      // 1. Түндік (Гельмгольц ауа резонансы: ~275 Гц)
      const helmholtz = context.createBiquadFilter();
      helmholtz.type = 'peaking';
      helmholtz.frequency.value = 275;
      helmholtz.Q.value = 3.2;
      helmholtz.gain.value = 7.5;

      // 2. Қарағай қақпақ резонансы (~435 Гц)
      const spruceTop = context.createBiquadFilter();
      spruceTop.type = 'peaking';
      spruceTop.frequency.value = 435;
      spruceTop.Q.value = 2.4;
      spruceTop.gain.value = 5.5;

      // 3. Қазақы қоңыр форманта (~1100 Гц)
      const warmMid = context.createBiquadFilter();
      warmMid.type = 'peaking';
      warmMid.frequency.value = 1100;
      warmMid.Q.value = 1.8;
      warmMid.gain.value = 3.0;

      // 4. Жұмсақ тарамыс сүзгісі (жоғары пернеде дыбысты қыспай, бірақ темір шыңғырын кеседі)
      const silkFilter = context.createBiquadFilter();
      silkFilter.type = 'lowpass';
      silkFilter.frequency.value = 2900 + (fretNum * 65);
      silkFilter.Q.value = 0.65;

      helmholtz.connect(spruceTop);
      spruceTop.connect(warmMid);
      warmMid.connect(silkFilter);

      return { inNode: helmholtz, outNode: silkFilter };
    }

    // Ішектің ұзақ, қоңыр тербелісін синтездеу (Physical Waveguide)
    function synthesizeDombraString(freq, fretNum, startDelay = 0, volume = 0.85) {
      ensureAudio();

      const startTime = ctx.currentTime + startDelay;
      const sr = ctx.sampleRate;
      const periodN = Math.max(8, Math.round(sr / freq));

      // ТЕРБЕЛІС ҰЗАҚТЫҒЫ: 3.5 – 4.2 секундқа дейін еркін күмбірлейді
      const duration = Math.max(2.4, 4.2 - (fretNum * 0.11));
      const totalSamples = Math.round(sr * duration);

      const buffer = ctx.createBuffer(1, totalSamples, sr);
      const data = buffer.getChannelData(0);

      // 1. Саусақ еті мен тырнақтың жұмсақ бастапқы серпіні (Smooth Pluck Exciter)
      const exciter = new Float32Array(periodN);
      let smoothPrev = 0;
      for (let i = 0; i < periodN; i++) {
        // Синустық күмбез: өткір темір сықырын болдырмайды
        const dome = Math.sin((Math.PI * i) / periodN);
        const raw = (Math.random() * 2 - 1) * dome;
        // Бастапқы шуды жұмсарту
        smoothPrev = smoothPrev * 0.62 + raw * 0.38;
        exciter[i] = smoothPrev;
      }

      // 2. Ішектің ұзақ сөну коэффициенті (0.9968 — тез өшіп қалмайды!)
      const decay = 0.9968 - (fretNum * 0.00022);
      // Ішкі жібек жұмсақтық коэффициенті
      const brightness = 0.28; 

      let prevSample = 0;
      for (let i = 0; i < totalSamples; i++) {
        if (i < periodN) {
          data[i] = exciter[i];
        } else {
          const delayed = data[i - periodN];
          // Төменгі гармоникаларды ұзақ сақтап, жоғарғысын майда сөндіру
          const current = ((1 - brightness) * delayed + brightness * prevSample) * decay;
          data[i] = current;
          prevSample = current;
        }
      }

      const source = ctx.createBufferSource();
      source.buffer = buffer;

      const woodBody = buildWoodBodyChain(ctx, fretNum);
      const masterGain = ctx.createGain();

      // Дыбыстың соңында кілт үзілмей, табиғи ауада сөнуі
      masterGain.gain.setValueAtTime(volume, startTime);
      masterGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.05);

      source.connect(woodBody.inNode);
      woodBody.outNode.connect(masterGain);
      masterGain.connect(ctx.destination);
      masterGain.connect(reverbNode);

      source.start(startTime);
    }

    // Қағыс кезіндегі саусақтың ағаш қақпаққа тиген жеңіл дыбысы (Wood Tap)
    function playWoodTap(startDelay = 0) {
      ensureAudio();
      const t = ctx.currentTime + startDelay;
      const osc = ctx.createOscillator();
      const tapGain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(155, t);
      osc.frequency.exponentialRampToValueAtTime(65, t + 0.035);

      tapGain.gain.setValueAtTime(0.18, t);
      tapGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);

      osc.connect(tapGain);
      tapGain.connect(ctx.destination);

      osc.start(t);
      osc.stop(t + 0.045);
    }

    function highlightFret(fretNum) {
      fretElements.forEach((el, idx) => {
        el.classList.toggle('active-fret', idx === fretNum);
      });
      document.getElementById('statusText').innerText =
        fretNum === 0 ? 'Ашық ішек (Ре - Соль) күмбірі' : `${fretNum}-перне шертілді`;
    }

    function animateString(lineId) {
      const line = document.getElementById(lineId);
      const dir = Math.random() > 0.5 ? 1 : -1;
      line.style.transform = `translateX(calc(-50% + ${dir * 3.5}px)) scaleX(1.75)`;
      setTimeout(() => {
        line.style.transform = 'translateX(-50%) scaleX(1)';
      }, 110);
    }

    // Пернені басып шерту
    function handleFretPluck(laneId, clientY) {
      const rect = document.getElementById('board').getBoundingClientRect();
      const relY = clientY - rect.top;

      let fret = Math.floor((relY / rect.height) * 15);
      fret = Math.max(0, Math.min(14, fret));
      selectedFret = fret;

      highlightFret(fret);

      const freq = BASE_FREQS[laneId] * DOMBRA_SCALE[fret];
      synthesizeDombraString(freq, fret, 0, 0.85);

      // Екінші бос ішектің өте жеңіл табиғи симпатикалық үндесуі (тек таза синус, шусыз)
      const otherLane = laneId === 'lane1' ? 'lane2' : 'lane1';
      synthesizeDombraString(BASE_FREQS[otherLane], 0, 0.015, 0.14);

      animateString(laneId === 'lane1' ? 'line1' : 'line2');
    }

    // Қос қағыс (Төмен және Жоғары кезектескен тірі қағыс)
    function handleDoubleStrum() {
      const fret = selectedFret;
      highlightFret(fret);

      const freq1 = BASE_FREQS.lane1 * (fret > 0 ? 1.0 : 1.0); // Үстіңгі ішек (бұрау тірегі)
      const freq2 = BASE_FREQS.lane2 * DOMBRA_SCALE[fret];     // Астыңғы әуен ішегі

      if (strumDirection === 1) {
        // Төмен қағыс: алдымен Ре, 15 мс кейін Соль
        synthesizeDombraString(freq1, 0, 0.0, 0.72);
        synthesizeDombraString(freq2, fret, 0.015, 0.90);
        playWoodTap(0.024);
      } else {
        // Жоғары (теріс) қағыс: алдымен Соль, 14 мс кейін Ре
        synthesizeDombraString(freq2, fret, 0.0, 0.88);
        synthesizeDombraString(freq1, 0, 0.014, 0.68);
      }

      strumDirection *= -1; // Келесі қағысты кезектестіру

      animateString('line1');
      setTimeout(() => animateString('line2'), 15);
    }

    ['lane1', 'lane2'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          handleFretPluck(id, e.changedTouches[i].clientY);
        }
      }, { passive: false });

      el.addEventListener('mousedown', e => {
        e.preventDefault();
        handleFretPluck(id, e.clientY);
      });
    });

    const strumPad = document.getElementById('strumPad');
    strumPad.addEventListener('touchstart', e => {
      e.preventDefault();
      handleDoubleStrum();
    }, { passive: false });
    strumPad.addEventListener('mousedown', e => {
      e.preventDefault();
      handleDoubleStrum();
    });
  </script>
</body>
</html>
