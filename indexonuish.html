<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>dombyr.com — Физикалық Акустика Зертханасы</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1a120b 0%, #060403 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #dfd0bc;
      overflow: hidden;
    }
    header {
      padding-top: 10px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: #e5a43b;
    }
    .hint {
      margin-top: 2px;
      font-size: 0.72rem;
      color: #8f755c;
    }

    .fretboard-wrap {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 74vh;
      background: linear-gradient(90deg, #24140a 0%, #3d2010 50%, #24140a 100%);
      border-radius: 12px;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #543118;
      overflow: hidden;
      display: flex;
    }

    .frets-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
    }
    .fret-slot {
      flex: 1;
      border-bottom: 2px solid #7d532d;
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-size: 0.65rem;
      color: #bf9870;
      pointer-events: none;
    }

    .strings-layer {
      position: absolute;
      inset: 0;
      display: flex;
      z-index: 10;
    }
    .string-lane {
      flex: 1;
      position: relative;
      cursor: pointer;
    }

    .string-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #cfb084, #fff3dc 50%, #997442);
      box-shadow: 0 0 6px rgba(229, 164, 59, 0.4);
      pointer-events: none;
      transition: transform 0.04s ease;
    }
    #line1 { width: 3.2px; }
    #line2 { width: 2.2px; }

    footer {
      padding-bottom: 12px;
      font-size: 0.72rem;
      color: #634f3c;
    }
  </style>
</head>
<body>

  <header>
    <h1>DOMBYR.COM</h1>
    <div class="hint">Физикалық толқын синтезі — 14 перне</div>
  </header>

  <div class="fretboard-wrap" id="board">
    <div class="frets-layer" id="frets"></div>
    <div class="strings-layer">
      <div class="string-lane" id="lane1"><div class="string-line" id="line1"></div></div>
      <div class="string-lane" id="lane2"><div class="string-line" id="line2"></div></div>
    </div>
  </div>

  <footer>Саусақ күшіне сай шанақтың тірі акустикалық үні</footer>

  <script>
    const fretsEl = document.getElementById('frets');
    for (let i = 1; i <= 14; i++) {
      const f = document.createElement('div');
      f.className = 'fret-slot';
      f.innerText = i + (i === 1 ? ' (Негізгі қоңыр)' : i === 14 ? ' (Шаңқыл)' : '');
      fretsEl.appendChild(f);
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let ctx = null;

    const BASE_FREQS = { lane1: 146.83, lane2: 196.00 }; // Re (D3), Sol (G3)
    const SCALE = [
      1.06, 1.12, 1.19, 1.26, 1.33, 1.41, 1.50,
      1.59, 1.68, 1.78, 1.89, 2.00, 2.12, 2.25
    ];

    // Шанақтың Гельмгольц акустикалық денесін құру
    function createBodyAcoustics(ctx) {
      // 1. Шанақтың төменгі күңгірі (Гельмгольц қуысы: ~290 Гц)
      const helmholtz = ctx.createBiquadFilter();
      helmholtz.type = "peaking";
      helmholtz.frequency.value = 290;
      helmholtz.Q.value = 4.5;
      helmholtz.gain.value = 7.0;

      // 2. Қарағай қақпақтың ағаштық икемі (~420 Гц)
      const woodPlate = ctx.createBiquadFilter();
      woodPlate.type = "peaking";
      woodPlate.frequency.value = 420;
      woodPlate.Q.value = 3.2;
      woodPlate.gain.value = 4.5;

      helmholtz.connect(woodPlate);
      return { inNode: helmholtz, outNode: woodPlate };
    }

    // Тек математикалық физика арқылы дыбыс синтездеу
    function synthesizePhysicalPluck(freq, fretNum, laneId) {
      if (!ctx) ctx = new AudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const sampleRate = ctx.sampleRate;
      const N = Math.round(sampleRate / freq);
      const duration = Math.max(0.9, 2.2 - (fretNum * 0.04));
      const totalSamples = Math.round(sampleRate * duration);

      const buffer = ctx.createBuffer(1, totalSamples, sampleRate);
      const output = buffer.getChannelData(0);

      // Саусақ/тырнақ соққысының импульсі
      const exciter = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        // Тырнақ жанасуының өткірлігі мен саусақ етінің қоңырлығы
        exciter[i] = (Math.random() * 2 - 1) * Math.exp(-i / (N * 0.35));
      }

      // Ішектің созылуы мен демпферлік сөнуі (Waveguide delay line)
      const decay = 0.991 - (fretNum * 0.0005);
      let lastVal = 0;
      for (let i = 0; i < totalSamples; i++) {
        if (i < N) {
          output[i] = exciter[i];
        } else {
          // Төменгі және жоғарғы гармоникалардың табиғи теңгерімі
          const filtered = (output[i - N] + lastVal) * 0.5 * decay;
          output[i] = filtered;
          lastVal = filtered;
        }
      }

      const src = ctx.createBufferSource();
      src.buffer = buffer;

      const body = createBodyAcoustics(ctx);
      const mainGain = ctx.createGain();
      mainGain.gain.setValueAtTime(0.8, ctx.currentTime);

      src.connect(body.inNode);
      body.outNode.connect(mainGain);
      mainGain.connect(ctx.destination);

      src.start();

      // Төменгі пернелерде екінші ішектің өздігінен қосыла үн қатуы (Sympathetic Drone)
      if (fretNum >= 5) {
        const otherFreq = laneId === 'lane2' ? BASE_FREQS.lane1 : BASE_FREQS.lane2;
        const droneN = Math.round(sampleRate / otherFreq);
        const droneDur = 1.0;
        const droneSamples = Math.round(sampleRate * droneDur);
        const droneBuf = ctx.createBuffer(1, droneSamples, sampleRate);
        const droneOut = droneBuf.getChannelData(0);

        for (let i = 0; i < droneSamples; i++) {
          droneOut[i] = (i < droneN ? (Math.random() - 0.5) * 0.1 : droneOut[i - droneN] * 0.985);
        }

        const droneSrc = ctx.createBufferSource();
        droneSrc.buffer = droneBuf;

        const droneGain = ctx.createGain();
        droneGain.gain.setValueAtTime(0.12, ctx.currentTime);

        droneSrc.connect(body.inNode);
        droneGain.connect(ctx.destination);
        droneSrc.start();
      }
    }

    function handleInput(laneId, clientY) {
      const board = document.getElementById('board');
      const rect = board.getBoundingClientRect();
      const relativeY = clientY - rect.top;

      let fret = Math.floor((relativeY / rect.height) * 14) + 1;
      fret = Math.max(1, Math.min(14, fret));

      const targetFreq = BASE_FREQS[laneId] * SCALE[fret - 1];
      synthesizePhysicalPluck(targetFreq, fret, laneId);

      const line = laneId === 'lane1' ? document.getElementById('line1') : document.getElementById('line2');
      const shift = (Math.random() > 0.5 ? 1 : -1) * 3;
      line.style.transform = `translateX(${shift}px) scaleX(1.5)`;
      setTimeout(() => { line.style.transform = 'none'; }, 60);
    }

    ['lane1', 'lane2'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          handleInput(id, e.changedTouches[i].clientY);
        }
      }, { passive: false });

      el.addEventListener('mousedown', e => {
        e.preventDefault();
        handleInput(id, e.clientY);
      });
    });
  </script>
</body>
</html>
