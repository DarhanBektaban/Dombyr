<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>dombyr.com</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1c140d 0%, #070503 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #d1ba9d;
      overflow: hidden;
    }
    header {
      padding-top: 14px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 4px;
      color: #e5a43b;
      font-weight: 700;
    }
    .hint {
      margin-top: 3px;
      font-size: 0.74rem;
      color: #8c7358;
    }

    /* Kishigirim naq dombyra sūlbasy */
    .dombyra-stage {
      position: relative;
      width: 100%;
      max-width: 340px;
      height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dombyra-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.85));
    }

    /* Qos Qyl Sezilu Alany */
    .strings-touch-layer {
      position: absolute;
      top: 10%;
      bottom: 6%;
      width: 120px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }

    .string-col {
      position: relative;
      width: 48%;
      height: 100%;
      cursor: pointer;
      display: flex;
      justify-content: center;
    }

    /* Qos ishektin' shynajy zhibek/zhila bederi */
    .visual-string {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #bfa175, #fff5e3 45%, #8c683b 100%);
      box-shadow: 0 0 4px rgba(229, 164, 59, 0.4);
      pointer-events: none;
      transition: transform 0.04s ease;
    }

    #str1 .visual-string { width: 3px; }
    #str2 .visual-string { width: 2px; }

    footer {
      padding-bottom: 14px;
      font-size: 0.72rem;
      color: #634f3c;
    }
  </style>
</head>
<body>

  <header>
    <h1>DOMBYR.COM</h1>
    <div class="hint">Moıny — qońyr | Shanaghy — shańqyl qaǵys</div>
  </header>

  <div class="dombyra-stage">
    <!-- Shynajy aghash dombyranyng bederi men pishini -->
    <svg class="dombyra-svg" viewBox="0 0 320 620" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Shanaq aǵashynyń qońyr reńi -->
        <linearGradient id="neckWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#2d170a"/>
          <stop offset="50%" stop-color="#4d2c16"/>
          <stop offset="100%" stop-color="#1f0f06"/>
        </linearGradient>

        <radialGradient id="bodyWood" cx="50%" cy="65%" r="60%">
          <stop offset="0%" stop-color="#693b1c"/>
          <stop offset="45%" stop-color="#47230d"/>
          <stop offset="85%" stop-color="#271104"/>
          <stop offset="100%" stop-color="#120601"/>
        </radialGradient>
      </defs>

      <!-- Moıyn (Sap) -->
      <rect x="144" y="20" width="32" height="330" rx="3" fill="url(#neckWood)" stroke="#1a0c04" stroke-width="2"/>

      <!-- Perneler (Lad) -->
      <line x1="144" y1="60" x2="176" y2="60" stroke="#7a5433" stroke-width="1.5"/>
      <line x1="144" y1="105" x2="176" y2="105" stroke="#7a5433" stroke-width="1.5"/>
      <line x1="144" y1="155" x2="176" y2="155" stroke="#7a5433" stroke-width="1.5"/>
      <line x1="144" y1="210" x2="176" y2="210" stroke="#7a5433" stroke-width="1.5"/>
      <line x1="144" y1="270" x2="176" y2="270" stroke="#7a5433" stroke-width="1.5"/>

      <!-- Shanaq (Qazaqy sobyq shanaq) -->
      <path d="M 144 260 
               C 115 310, 55 380, 55 470 
               C 55 565, 115 595, 160 595 
               C 205 595, 265 565, 265 470 
               C 265 380, 205 310, 176 260 Z" 
            fill="url(#bodyWood)" 
            stroke="#75431f" 
            stroke-width="2"/>

      <!-- Shanaq oıyǵy (Túnlik / Dekadaghy tesik) -->
      <circle cx="160" cy="460" r="11" fill="#0c0502" stroke="#40200c" stroke-width="2"/>

      <!-- Tıek (Aǵash túıme) -->
      <rect x="132" y="535" width="56" height="7" rx="3.5" fill="#140702" stroke="#4a250e" stroke-width="1"/>
      <circle cx="160" cy="570" r="6" fill="#0d0502"/>
    </svg>

    <!-- Qos Qyl Sezimi -->
    <div class="strings-touch-layer">
      <!-- 1-qyl: Ústińgi Re (D3) búrauy -->
      <div class="string-col" id="str1">
        <div class="visual-string"></div>
      </div>

      <!-- 2-qyl: Astyńǵy Sol (G3) áueni -->
      <div class="string-col" id="str2">
        <div class="visual-string"></div>
      </div>
    </div>
  </div>

  <footer>Eki sausaqpen sap pen shanaq tusynan qaghyngyz</footer>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let ctx = null;

    const NOTES = {
      str1: 146.83, // Re (D3)
      str2: 196.00  // Sol (G3)
    };

    // Shynajy dombyra akusti'kalyq modelı
    function playAuthenticDombra(fundFreq, yFactor) {
      if (!ctx) ctx = new AudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const now = ctx.currentTime;

      // 1. Shanaqtyng terbelip gwildewi (Aghash deka rezonansy)
      const bodyBand1 = ctx.createBiquadFilter();
      bodyBand1.type = "bandpass";
      bodyBand1.frequency.value = 340; // Aghashtyng negizgi qońyr üni
      bodyBand1.Q.value = 4.0;

      const bodyBand2 = ctx.createBiquadFilter();
      bodyBand2.type = "peaking";
      bodyBand2.frequency.value = 1100; // Shanaqtyng shart ete tuisui
      bodyBand2.Q.value = 2.0;
      bodyBand2.gain.value = 4.0 + (yFactor * 5.0);

      const mainGain = ctx.createGain();
      mainGain.connect(ctx.destination);

      bodyBand1.connect(bodyBand2);
      bodyBand2.connect(mainGain);

      // 2. Qazaqy dombyra qylynyng negizgi 6 obertony (Garmoni'kalar)
      const partials = [1, 2, 3, 4, 5, 6];
      const brightness = 0.2 + (yFactor * 0.8);

      partials.forEach((p, idx) => {
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();

        osc.type = (idx === 0) ? "triangle" : "sawtooth";
        osc.frequency.setValueAtTime(fundFreq * p, now);

        // Qaghyptyng qozghalu uzaqtyghy (decay)
        const decay = (1.5 / (p * 0.95)) * (1 - yFactor * 0.22);
        const amp = (0.24 / Math.pow(p, 0.85)) * (idx === 0 ? 1.0 : brightness);

        oscGain.gain.setValueAtTime(amp, now);
        oscGain.gain.exponentialRampToValueAtTime(0.00001, now + decay);

        osc.connect(oscGain);
        oscGain.connect(bodyBand1);

        osc.start(now);
        osc.stop(now + decay);
      });

      // 3. Tyrnaqtyng qylgha shaq ete qalu serpilisi (Attack transient)
      const snapLen = Math.round(ctx.sampleRate * 0.02);
      const snapBuf = ctx.createBuffer(1, snapLen, ctx.sampleRate);
      const snapData = snapBuf.getChannelData(0);

      for (let i = 0; i < snapLen; i++) {
        snapData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (snapLen * 0.25));
      }

      const snapSource = ctx.createBufferSource();
      snapSource.buffer = snapBuf;

      const snapFilter = ctx.createBiquadFilter();
      snapFilter.type = "highpass";
      snapFilter.frequency.value = 1200 + (yFactor * 2200);

      const snapGain = ctx.createGain();
      snapGain.gain.setValueAtTime(0.22 + (yFactor * 0.2), now);

      snapSource.connect(snapFilter);
      snapFilter.connect(snapGain);
      snapGain.connect(mainGain);

      snapSource.start(now);
    }

    function triggerString(el, clientY) {
      const rect = el.getBoundingClientRect();
      let yFactor = (clientY - rect.top) / rect.height;
      yFactor = Math.max(0, Math.min(1, yFactor));

      playAuthenticDombra(NOTES[el.id], yFactor);

      // Qyldyng serpilui
      const line = el.querySelector('.visual-string');
      const shift = (Math.random() > 0.5 ? 1 : -1) * (2.5 + yFactor * 3.5);
      line.style.transform = `skewX(${shift}deg) scaleX(${1.6 + yFactor})`;

      setTimeout(() => {
        line.style.transform = 'none';
      }, 65);
    }

    // Ekran basqaru (Touch / Mouse)
    ['str1', 'str2'].forEach(id => {
      const el = document.getElementById(id);

      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          triggerString(el, e.changedTouches[i].clientY);
        }
      }, { passive: false });

      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handleMousedown(el, e);
      });
    });

    function handleMousedown(el, e) {
      triggerString(el, e.clientY);
    }
  </script>
</body>
</html>
